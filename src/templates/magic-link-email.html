<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to De-ID Studio</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f9fafb; font-family: sans-serif">
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f9fafb"
    >
      <tr>
        <td align="center" style="padding: 40px 10px">
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 600px;
              background-color: #ffffff;
              border-radius: 16px;
              overflow: hidden;
              border: 1px solid #e5e7eb;
            "
          >
            <tr>
              <td
                align="center"
                style="background-color: #05193c; padding: 32px 20px; color: #ffffff"
              >
                <div style="font-size: 22px; font-weight: bold">De-ID Studio</div>
                <div style="font-size: 14px; opacity: 0.8">De-ID & Synthesis</div>
              </td>
            </tr>
            <tr>
              <td style="padding: 48px 40px; text-align: center">
                <h1 style="font-size: 28px; color: #111827; margin-bottom: 16px">
                  Sign in to De-ID Studio
                </h1>
                <p style="color: #4b5563; font-size: 16px">Hi there,</p>
                <p style="color: #4b5563; font-size: 16px; margin-bottom: 32px">
                  Click the button below to sign in to your account.<br />This link is valid for 15
                  minutes.
                </p>
                <a
                  href="{{link}}"
                  style="
                    background-color: #1e3a8a;
                    color: #ffffff;
                    padding: 14px 32px;
                    text-decoration: none;
                    border-radius: 8px;
                    font-weight: bold;
                    display: inline-block;
                  "
                  >Sign In to De-ID Studio &rarr;</a
                >
                <div style="margin: 32px 0; border-top: 1px solid #e5e7eb; position: relative">
                  <span
                    style="
                      position: absolute;
                      top: -10px;
                      background: #fff;
                      padding: 0 10px;
                      color: #9ca3af;
                      left: 45%;
                    "
                    >or</span
                  >
                </div>
                <p style="font-size: 14px; color: #6b7280">Or copy this link into your browser:</p>
                <p style="font-size: 14px; word-break: break-all">
                  <a href="{{link}}" style="color: #3b82f6">{{link}}</a>
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 24px 40px;
                  text-align: center;
                  border-top: 1px solid #e5e7eb;
                  color: #9ca3af;
                  font-size: 12px;
                "
              >
                If you didn't request this email, you can safely ignore it.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
