<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Clinical-Data Studio</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #ffffff"
    >
      <tr>
        <td align="center" style="padding: 49px">
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="width: 552px; background-color: #131b2e; border-radius: 8px; overflow: hidden"
          >
            <tr>
              <td style="padding: 56px 40px 0px 40px; text-align: center">
                <h1
                  style="
                    font-size: 32px;
                    font-weight: 400;
                    color: #ffffff;
                    margin: 0 0 24px 0;
                    letter-spacing: -0.02em;
                  "
                >
                  Sign in to Clinical-Data Studio
                </h1>
                <p style="font-size: 18px; line-height: 28px; color: #cbd5e1; margin-bottom: 40px">
                  Hi there,<br />
                  Click the button below to sign in to your account.<br />
                  <span style="color: #64748b">This link is valid for 15 minutes.</span>
                </p>
                <a
                  href="{{link}}"
                  style="
                    background-color: #afc6ff;
                    color: #111827;
                    padding: 16px 48px;
                    text-decoration: none;
                    border-radius: 12px;
                    font-weight: 600;
                    font-size: 16px;
                    display: inline-block;
                    margin-bottom: 40px"
                  "
                  >Sign In &rarr;</a
                >
                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="margin: 0 0 24px 0"
                >
                  <tr>
                    <td style="width: 45%; vertical-align: middle">
                      <div style="border-top: 1px solid #1E293B"></div>
                    </td>
                    <td
                      style="
                        width: 10%;
                        text-align: center;
                        color: #9ca3af;
                        font-size: 14px;
                        text-transform: lowercase;
                      "
                    >
                      or
                    </td>
                    <td style="width: 45%; vertical-align: middle">
                      <div style="border-top: 1px solid #1E293B"></div>
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    font-size: 12px;
                    color: #64748B;
                    margin: 0 0 16px 0;
                    text-transform: uppercase;
                    letter-spacing: 0.05em;
                  "
                >
                  Or copy this link into your browser:
                </p>
                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="background-color: #0D111A; border-radius: 8px; margin-bottom: 16px"
                >
                  <tr>
                    <td
                      style="
                        padding: 16px;
                        word-break: break-all;
                        text-align: left;
                        font-size: 14px;
                        line-height: 20px;
                      "
                    >
                      <a href="{{link}}" style="color: #60A5FA; text-decoration: none">{{link}}</a>
                    </td>
                    <td style="padding: 16px; width: 24px; vertical-align: top; text-align: right">
                      <img
                        src="https://img.icons8.com/material-outlined/24/9ca3af/copy.png"
                        alt="copy"
                        width="20"
                        height="20"
                        style="display: block; border: 0"
                      />
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 40px 48px 40px">
                <table width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td
                      style="text-align: center; color: #64748B; font-size: 14px; line-height: 20px"
                    >
                      If you didn't request this email, you can safely ignore it.
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
