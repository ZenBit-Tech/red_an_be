<!doctype html>
<html>
  <body>
    <h2 style="color: #1e3a8a">New Lead Request</h2>
    <table style="width: 100%; border-collapse: collapse">
      <tr>
        <td style="padding: 8px; border: 1px solid #ddd"><b>First Name:</b></td>
        <td style="padding: 8px; border: 1px solid #ddd">{{firstName}}</td>
      </tr>
      <tr>
        <td style="padding: 8px; border: 1px solid #ddd"><b>Last Name:</b></td>
        <td style="padding: 8px; border: 1px solid #ddd">{{lastName}}</td>
      </tr>
      <tr>
        <td style="padding: 8px; border: 1px solid #ddd"><b>Company:</b></td>
        <td style="padding: 8px; border: 1px solid #ddd">{{company}}</td>
      </tr>
      <tr>
        <td style="padding: 8px; border: 1px solid #ddd"><b>Email:</b></td>
        <td style="padding: 8px; border: 1px solid #ddd">{{email}}</td>
      </tr>
    </table>
    <p><b>Message:</b></p>
    <div style="padding: 15px; background: #f9f9f9; border-left: 4px solid #1e3a8a">
      {{message}}
    </div>
  </body>
</html>
