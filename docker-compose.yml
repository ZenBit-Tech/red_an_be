services:
  back:
    build: .
    container_name: clinical-curator-be
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DE_ID_REMOTE_NLP_URL: http://clinical-curator-remote-nlp:8080
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - clinical-curator-network

  remote-nlp:
    build:
      context: ./remote-nlp
    container_name: clinical-curator-remote-nlp
    restart: unless-stopped
    environment:
      REMOTE_NLP_MODEL: ${REMOTE_NLP_MODEL:-facebook/bart-large-mnli}
      REMOTE_NLP_DEVICE: ${REMOTE_NLP_DEVICE:--1}
      REMOTE_NLP_DEFAULT_THRESHOLD: ${REMOTE_NLP_DEFAULT_THRESHOLD:-0.9}
      REMOTE_NLP_MAX_SENTENCE_LENGTH: ${REMOTE_NLP_MAX_SENTENCE_LENGTH:-700}
    ports:
      - '5003:8080'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://localhost:8080/health", timeout=2)',
        ]
      start_period: 10m
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - clinical-curator-network

  mysql:
    image: mysql:8.0
    container_name: clinical-curator-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
      MYSQL_DATABASE: ${DB_NAME}
      # MYSQL_USER: ${DB_USERNAME}
      # MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 20s
      retries: 10
    networks:
      - clinical-curator-network

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: clinical-curator-presidio-analyzer
    restart: unless-stopped
    depends_on:
      remote-nlp:
        condition: service_healthy
    ports:
      - '5001:3000'
    networks:
      - clinical-curator-network

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: clinical-curator-presidio-anonymizer
    restart: unless-stopped
    ports:
      - '5002:3000'
    networks:
      - clinical-curator-network

volumes:
  mysql_data:
    driver: local

networks:
  clinical-curator-network:
    driver: bridge
